<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description"><title id="title">Save this for your next idea</title><desc id="description">Editorial text graphic reading “Save this for your next idea”. Make room for a little creativity. Choose one useful surface.</desc><rect width="1000" height="1500" fill="#132e27"/><path d="M84 175H916" stroke="#bdd5aa" stroke-width="2"/><text x="84" y="117" font-family="Arial,sans-serif" font-size="24" letter-spacing="5" fill="#f5efe3">MONA’S MEDIA / FIELD NOTES</text><text x="84" y="225" font-family="Arial,sans-serif" font-size="24" letter-spacing="3" fill="#bdd5aa">SAVE FOR LATER</text><text font-family="Georgia,serif" font-size="86" fill="#f5efe3"><tspan x="84" y="295">Save this for your</tspan><tspan x="84" y="395">next idea</tspan></text><path d="M84 805Q500 665 916 805M84 836Q500 696 916 836" fill="none" stroke="#bdd5aa" stroke-width="3"/><text font-family="Arial,sans-serif" font-size="32" fill="#f5efe3"><tspan x="84" y="920">Make room for a little creativity. Choose</tspan><tspan x="84" y="962">one useful surface.</tspan></text><path d="M84 1340H916" stroke="#bdd5aa" stroke-width="2"/><text x="84" y="1400" font-family="Arial,sans-serif" font-size="25" fill="#f5efe3">READ THE FULL NOTE</text><text x="916" y="1400" text-anchor="end" font-family="Georgia,serif" font-size="38" fill="#f5efe3">07</text></svg>