<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title description"><title id="title">Keep this: Make room for a little creativity</title><desc id="description">Editorial text graphic reading “Keep this: Make room for a little creativity”. Choose one useful surface. Keep the tools you reach for close by. Leave a little space for work in progress.</desc><rect width="1000" height="1500" fill="#132e27"/><path d="M84 175H916" stroke="#bdd5aa" stroke-width="2"/><text x="84" y="117" font-family="Arial,sans-serif" font-size="24" letter-spacing="5" fill="#f5efe3">MONA’S MEDIA / FIELD NOTES</text><text x="84" y="225" font-family="Arial,sans-serif" font-size="24" letter-spacing="3" fill="#bdd5aa">SAVE FOR LATER</text><text font-family="Georgia,serif" font-size="83.67346938775512" fill="#f5efe3"><tspan x="84" y="295">Keep this: Make</tspan><tspan x="84" y="395">room for a little</tspan><tspan x="84" y="495">creativity</tspan></text><path d="M84 805Q500 665 916 805M84 836Q500 696 916 836" fill="none" stroke="#bdd5aa" stroke-width="3"/><text font-family="Arial,sans-serif" font-size="32" fill="#f5efe3"><tspan x="84" y="920">Choose one useful surface. Keep the tools</tspan><tspan x="84" y="962">you reach for close by. Leave a little</tspan><tspan x="84" y="1004">space for work in progress.</tspan></text><path d="M84 1340H916" stroke="#bdd5aa" stroke-width="2"/><text x="84" y="1400" font-family="Arial,sans-serif" font-size="25" fill="#f5efe3">READ THE FULL NOTE</text><text x="916" y="1400" text-anchor="end" font-family="Georgia,serif" font-size="38" fill="#f5efe3">07</text></svg>